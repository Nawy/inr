[package]
name = "inr"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["aes", "rand_core"] }
anyhow = "1.0.104"
arboard = "3.6.1"
argon2 = "0.6.0"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
getrandom = "0.4.3"
inquire = "0.9.4"
nanoid = "0.5.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.1"
zeroize = "1.9.0"
